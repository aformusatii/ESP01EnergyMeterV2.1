; ESP01EnergyMeterV2 - ESP-01S + PZEM-004T v3.0 energy meter
; Migrated from the Eclipse Sloeber project (esp8266 core 3.0.2, "Generic ESP8266 Module").
;
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp01_1m

[env]
platform = espressif8266@4.2.1
framework = arduino
board = esp01_1m

; --- Board settings, matching the original Sloeber/Arduino IDE menu ---
; CPU 160 MHz, 26 MHz crystal (default)
board_build.f_cpu = 160000000L
; Flash: 1M, no filesystem (OTA needs the free space), 40 MHz, DOUT (required by ESP-01S)
board_build.flash_mode = dout
board_build.f_flash = 40000000L
board_build.ldscript = eagle.flash.1m.ld

build_flags =
    ; ESP-01S blue LED is on GPIO2. The generic variant defaults to GPIO1 (= UART TX),
    ; which would corrupt the PZEM serial link.
    -DLED_BUILTIN=2
    ; lwIP v2 Lower Memory (Sloeber: ip=lm2f) - also the PlatformIO default, stated explicitly
    -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY

lib_deps =
    bblanchon/ArduinoJson@7.2.0
    256dpi/MQTT@2.5.2
    ; v1.2.1 is not published to the PlatformIO registry (latest there is 1.1.2)
    https://github.com/mandulaj/PZEM-004T-v30.git#v1.2.1

monitor_speed = 115200

; Serial flashing (USB-UART adapter)
[env:esp01_1m]
upload_port = COM5
upload_speed = 115200
upload_resetmethod = ck

; OTA flashing through the built-in /update web page (ESP8266HTTPUpdateServer)
;   pio run -e esp01_1m_ota -t upload
[env:esp01_1m_ota]
upload_protocol = custom
custom_ota_url = http://192.168.100.23/update
extra_scripts = scripts/ota_upload.py
; refuse to build OTA firmware with placeholder WiFi credentials (device would be unreachable)
build_flags =
    ${env.build_flags}
    -DREQUIRE_WIFI_CONFIG
